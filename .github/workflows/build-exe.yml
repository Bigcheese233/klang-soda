name: Build Klang Soda

on:
  workflow_dispatch:
    inputs:
      build_legacy_qt:
        description: Also build the unchanged legacy Qt edition (no Soda integration)
        type: boolean
        default: false
        required: false

jobs:
  build:
    if: ${{ inputs.build_legacy_qt }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check vendored pyncm
        shell: pwsh
        run: |
          if (-not (Test-Path vendor/pyncm/__init__.py)) {
            throw "vendor/pyncm/__init__.py not found. pyncm was removed from PyPI; copy your local pyncm package folder into vendor/pyncm."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # pyncm 已从 PyPI 撤下，改用仓库内 vendor/pyncm；其余依赖照常安装
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*pyncm' } | Set-Content requirements-ci.txt
          pip install -r requirements-ci.txt pyinstaller pycryptodome pycryptodomex

      - name: Import check
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: vendor
        run: python -c "import pyncm, qt6_player.main_window; print('import ok', pyncm.__file__)"

      - name: Build exe
        env:
          PYTHONPATH: vendor
        run: pyinstaller Klang.spec --noconfirm

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Klang.exe)) { throw "dist/Klang.exe was not produced" }
          Get-Item dist/Klang.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Klang-windows-exe
          path: dist/Klang.exe
          if-no-files-found: error

  build-winui:
    name: Build Klang Soda WinUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: >
          dotnet publish Klang.WinUI/Klang.WinUI.csproj
          -c Release -r win-x64 -p:Platform=x64 --self-contained true
          -o publish/KlangSoda

      - name: Prepare runtime, notices and matching source
        shell: pwsh
        run: ./installer/PreparePublish.ps1 -PublishDirectory ./publish/KlangSoda

      - name: Verify output
        shell: pwsh
        run: |
          foreach ($f in "Klang.Soda.exe", "Klang.Soda.pri", "Runtime/Soda/Node/node.exe", "Runtime/Soda/Node/LICENSE", "Source/klang-soda-source.zip", "LICENSE", "PRIVACY.md", "THIRD_PARTY_NOTICES.md") {
            if (-not (Test-Path "publish/KlangSoda/$f")) { throw "$f was not produced" }
          }
          Get-Item publish/KlangSoda/Klang.Soda.exe | Select-Object Name, Length

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/KlangSoda/* -DestinationPath KlangSoda-WinUI-win-x64.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content Klang.WinUI/Klang.WinUI.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $ver) { throw "Version not found in csproj" }
          choco install innosetup -y --no-progress
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=$ver" "/DSourceDir=..\publish\KlangSoda" installer/Klang.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem dist-installer | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: KlangSoda-WinUI-win-x64
          path: KlangSoda-WinUI-win-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KlangSoda-WinUI-Setup
          path: dist-installer/KlangSoda-Setup-*-x64.exe
          if-no-files-found: error
